name: Test and deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # UTC 09:00 / 13:00 = Asia/Taipei 17:00 / 21:00, every day.
    - cron: "0 9,13 * * *"
permissions:
  contents: read
  pages: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch latest official daily data
        if: github.event_name != 'pull_request'
        run: npm run update:market
      - name: Prepare financial PDF reader
        if: github.event_name != 'pull_request'
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Refresh point-in-time stock analysis
        if: github.event_name != 'pull_request'
        run: npm run update:analysis
      - name: Restore official OTC daily archive
        uses: actions/cache@v4
        with:
          path: data/universe/tpex-days
          key: otc-daily-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            otc-daily-${{ runner.os }}-
      - name: Refresh all-market stock catalog and OTC history
        if: github.event_name != 'pull_request'
        run: npm run update:universe
      - name: Restore verified MOPS cash-flow observations
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: data/mops-cashflows.json
          key: mops-cashflow-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mops-cashflow-v1-${{ runner.os }}-
      - name: Supplement official financials with bounded batch requests
        if: github.event_name != 'pull_request'
        run: npm run update:financials
        env:
          NODE_USE_ENV_PROXY: 1
      - name: Materialize verified cash flows for offline PR builds
        if: github.event_name == 'pull_request'
        run: npm run update:financials:offline
      - name: Refresh SEC filings and verified US fundamentals
        if: github.event_name != 'pull_request'
        run: npm run update:us
        env:
          NODE_USE_ENV_PROXY: 1
          SEC_UPDATES_ENABLED: ${{ vars.SEC_UPDATES_ENABLED }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
          US_PUBLISH_MARKET_DATA: ${{ vars.US_PUBLISH_MARKET_DATA }}
          US_ALPACA_FEED: ${{ vars.US_ALPACA_FEED }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          US_MARKET_DATA_LICENSE_URL: ${{ vars.US_MARKET_DATA_LICENSE_URL }}
          US_MARKET_DATA_LICENSE_CHECKED_AT: ${{ vars.US_MARKET_DATA_LICENSE_CHECKED_AT }}
          US_MARKET_DATA_CACHE_POLICY: ${{ vars.US_MARKET_DATA_CACHE_POLICY }}
      - name: Refresh dated market rankings and official price limits
        if: github.event_name != 'pull_request'
        run: npm run update:overview
        env:
          NODE_USE_ENV_PROXY: 1
      - name: Restore verified daily ETF NAV history
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: data/etf-nav-cache.json
          key: etf-nav-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            etf-nav-v1-${{ runner.os }}-
      - name: Refresh open-licensed official daily ETF NAV
        if: github.event_name != 'pull_request'
        run: npm run update:etf-nav
        env:
          NODE_USE_ENV_PROXY: 1
      - run: npm test
      - name: Build standalone page
        run: npm run build:pages
        env:
          VITE_MARKET_API_ORIGIN: ${{ vars.VITE_MARKET_API_ORIGIN }}
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
